name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    name: Quality gates
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.10"
          enable-cache: true

      - name: Install Python (respects .python-version)
        run: uv python install

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Format check
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy src/bmv_cli/api src/bmv_cli/commands

      - name: Test
        run: uv run pytest
