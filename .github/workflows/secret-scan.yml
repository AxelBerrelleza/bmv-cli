name: secret-scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Run gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "$(curl -sSf https://api.github.com/repos/gitleaks/gitleaks/releases/latest \
               | grep -o 'https://[^"]*gitleaks_.*_linux_x64.tar.gz' | head -1)"
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --no-banner --redact --exit-code 1
